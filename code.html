<p class="stamp" style="color:#bdb6a8">© 2026 Suhani Khanna</p></div></footer><script>const CODE={"Signal": [["features/baseline_engine.py \u00b7 UserBaseline", "class UserBaseline:\n    \"\"\"All tracked-feature sliding windows for one user.\"\"\"\n\n    def __init__(self, window_size: int = BASELINE_WINDOW_SIZE):\n        self.windows: Dict[str, SlidingWindowStats] = {\n            feat: SlidingWindowStats(window_size) for feat in TRACKED_FEATURES\n        }\n\n    def update(self, feature_row: dict) -> None:\n        for feat in TRACKED_FEATURES:\n            if feat in feature_row and feature_row[feat] is not None:\n                self.windows[feat].push(float(feature_row[feat]))\n\n    def z_scores(self, feature_row: dict) -> Dict[str, float]:\n        return {\n            feat: self.windows[feat].z_score(float(feature_row[feat]))\n            for feat in TRACKED_FEATURES\n            if feat in feature_row and feature_row[feat] is not None\n        }\n\n    def is_ready(self) -> bool:\n        \"\"\"Baseline is only meaningful once at least one window has enough history.\"\"\"\n        return any(w.is_full() for w in self.windows.values())\n\n    def snapshot(self) -> dict:\n        return {feat: w.snapshot() for feat, w in self.windows.items()}"], ["features/drift_scoring.py \u00b7 score_drift", "def score_drift(z_row: Dict[str, float]) -> dict:\n    \"\"\"\n    Given a dict of z_<feature> -> z-score values (as produced by\n    BaselineEngine.replay), returns:\n      - drift_score: weighted mean absolute z-score (0 = no drift; grows unbounded)\n      - flagged_features: list of features whose |z| exceeded DRIFT_Z_THRESHOLD\n      - n_flagged: convenience count\n    \"\"\"\n    if not z_row:\n        return {\"drift_score\": 0.0, \"flagged_features\": [], \"n_flagged\": 0}\n\n    weighted_sum = 0.0\n    weight_total = 0.0\n    flagged: List[str] = []\n\n    for feat, z in z_row.items():\n        if pd.isna(z):\n            continue\n        w = FEATURE_WEIGHTS.get(feat, 1.0)\n        clipped_z = min(abs(z), MAX_ABS_Z)\n        weighted_sum += w * clipped_z\n        weight_total += w\n        if abs(z) >= DRIFT_Z_THRESHOLD:\n            flagged.append(feat.replace(\"z_\", \"\"))\n\n    drift_score = round(weighted_sum / weight_total, 4) if weight_total else 0.0\n    return {\"drift_score\": drift_score, \"flagged_features\": flagged, \"n_flagged\": len(flagged)}"], ["dsa/top_k_heap.py \u00b7 bounded min-heap", "class TopKRiskHeap:\n    def __init__(self, k: int):\n        if k <= 0:\n            raise ValueError(\"k must be positive\")\n        self.k = k\n        self._heap: List[RiskEntry] = []\n\n    def push(self, user_id: str, score: float, details: dict = None) -> None:\n        entry = RiskEntry(score=score, user_id=user_id, details=details or {})\n        if len(self._heap) < self.k:\n            heapq.heappush(self._heap, entry)\n        elif score > self._heap[0].score:\n            heapq.heapreplace(self._heap, entry)\n        # else: score too low to make the cut, O(1) discard\n\n    def top_k(self) -> List[RiskEntry]:\n        \"\"\"Return entries sorted descending by risk score.\"\"\"\n        return sorted(self._heap, key=lambda e: e.score, reverse=True)"]], "Sentinel Rate Limiter": [["RateLimiterService.java \u00b7 atomic Lua script", "    private static final String SLIDING_WINDOW_SCRIPT = \"\"\"\n            local key       = KEYS[1]\n            local now       = tonumber(ARGV[1])\n            local win_start = tonumber(ARGV[2])\n            local limit     = tonumber(ARGV[3])\n            local win_ms    = tonumber(ARGV[4])\n\n            -- 1. Evict timestamps outside the window\n            redis.call('ZREMRANGEBYSCORE', key, 0, win_start)\n\n            -- 2. Count remaining\n            local count = redis.call('ZCARD', key)\n\n            if count < limit then\n                -- 3. Record this request (score = timestamp, member = timestamp for uniqueness)\n                redis.call('ZADD', key, now, now .. '-' .. math.random(1, 1000000))\n                -- 4. Reset TTL so the key expires naturally after the window\n                redis.call('PEXPIRE', key, win_ms)\n                return {1, count + 1}\n            else\n                return {0, count}\n            end\n            \"\"\";"]], "MerchantLens": [["procedures/02_escalate_disputes.sql", "CREATE OR REPLACE FUNCTION escalate_overdue_disputes()\nRETURNS INT\nLANGUAGE plpgsql\nAS $$\nDECLARE\n    v_count INT := 0;\n    v_dispute RECORD;\nBEGIN\n    FOR v_dispute IN\n        SELECT dispute_id, cb_reference, merchant_id, response_due_by\n        FROM   disputes\n        WHERE  status          IN ('UNDER_REVIEW', 'EVIDENCE_SUBMITTED')\n          AND  response_due_by  < CURRENT_DATE\n          AND  resolved_at     IS NULL\n        FOR UPDATE SKIP LOCKED\n    LOOP\n        -- FSM trigger (02_dispute_fsm.sql) will validate this transition\n        UPDATE disputes\n        SET    status       = 'ARBITRATION',\n               outcome_note = FORMAT(\n                   'Auto-escalated to ARBITRATION on %s: response deadline %s was missed.',\n                   CURRENT_DATE, v_dispute.response_due_by\n               ),\n               assigned_to  = 'SYSTEM_ESCALATION'\n        WHERE  dispute_id = v_dispute.dispute_id;\n\n        RAISE NOTICE 'Escalated dispute % (merchant %) \u2014 deadline was %',"]], "Anomaly Notifier": [["main.py \u00b7 compute_risk", "def compute_risk(\n    amount: float,\n    time_gap_minutes: Optional[float] = None,\n    location: Optional[str] = \"Unknown\",\n    device: Optional[str] = \"mobile\",\n) -> dict:\n    \"\"\"\n    Multi-factor rule engine.\n    Rules:\n      1. Z-score (statistical outlier)\n      2. Absolute value threshold\n      3. Velocity (time since last transaction)\n      4. Location risk          \u2190 NEW\n      5. Device risk            \u2190 NEW\n\n    Returns z_score, risk_score (0-100), confidence, status, alert flag, reason.\n    \"\"\"\n    z_score = (amount - mean_amount) / std_amount\n    risk_score = 0\n    reasons = []\n\n    # \u2500\u2500 Rule 1: statistical outlier \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    if abs(z_score) > 3.0:\n        risk_score += 50\n        reasons.append(f\"extreme z-score ({z_score:.2f})\")\n    elif abs(z_score) > 2.0:\n        risk_score += 30\n        reasons.append(f\"high z-score ({z_score:.2f})\")\n    elif abs(z_score) > 1.5:\n        risk_score += 15\n        reasons.append(f\"elevated z-score ({z_score:.2f})\")\n\n    # \u2500\u2500 Rule 2: absolute high-value threshold \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    if amount > 10_000:\n        risk_score += 25"]], "Benchmarking": [["SortingAlgorithms.java \u00b7 bucketSort", "    public static int[] bucketSort(int[] input, int min, int max) {\n        int range = max - min + 1;\n        int[] freq = new int[range];\n\n        for (int val : input) {\n            freq[val - min]++;\n        }\n\n        int[] result = new int[input.length];\n        int idx = 0;\n        for (int i = 0; i < range; i++) {\n            int count = freq[i];\n            while (count-- > 0) {\n                result[idx++] = i + min;\n            }\n        }\n        return result;"]], "Apache Ant": [["build.xml \u00b7 dependency chain Ant resolves by topological sort", "<target name=\"init\"/>\n<target name=\"compile\" depends=\"init\"/>\n<target name=\"jar\"     depends=\"compile\"/>\n<target name=\"run\"     depends=\"jar\"/>\n\n<!-- ant run  =>  init -> compile -> jar -> run -->"]]};const tabs=document.getElementById('tabs'),files=document.getElementById('files'),src=document.getElementById('src');

pick('Signal');
